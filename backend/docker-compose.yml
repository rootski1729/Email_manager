version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailfilter_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./waha_sessions:/app/waha_sessions  # WAHA session persistence
      - ./waha_files:/app/waha_files  # WAHA file storage
    networks:
      - emailfilter_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo 'Waiting for external services (PostgreSQL, Redis, WAHA)...' &&
        sleep 10 &&
        echo 'Starting FastAPI server (migrations skipped - run manually if needed)...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailfilter_celery_worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./waha_sessions:/app/waha_sessions  # WAHA session persistence
      - ./waha_files:/app/waha_files  # WAHA file storage
    networks:
      - emailfilter_network
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=solo

  # Celery Beat (Scheduled Tasks)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailfilter_celery_beat
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    networks:
      - emailfilter_network
    command: celery -A app.tasks.celery_app beat --loglevel=info

  # Flower (Celery Monitoring)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailfilter_flower
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "5555:5555"
    networks:
      - emailfilter_network
    command: celery -A app.tasks.celery_app flower --port=5555

networks:
  emailfilter_network:
    driver: bridge

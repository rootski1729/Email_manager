version: '3.8'

services:
  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailfilter_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    networks:
      - emailfilter_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting FastAPI server...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailfilter_celery_worker
    depends_on:
      - backend
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    networks:
      - emailfilter_network
    command: celery -A app.tasks.celery_app worker --loglevel=info

  # Celery Beat (Scheduled Tasks)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailfilter_celery_beat
    depends_on:
      - backend
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    networks:
      - emailfilter_network
    command: celery -A app.tasks.celery_app beat --loglevel=info

  # Flower (Celery Monitoring)
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emailfilter_flower
    depends_on:
      - celery_worker
    env_file:
      - .env
    ports:
      - "5555:5555"
    networks:
      - emailfilter_network
    command: celery -A app.tasks.celery_app flower --port=5555

networks:
  emailfilter_network:
    driver: bridge

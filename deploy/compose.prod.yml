# Production: the whole system on one VM behind Caddy (automatic HTTPS). Only ports 80/443 are published.
#
#   Easiest:  ./mailsentinel.sh install        (creates .env, builds, starts)
#   By hand:  docker compose --env-file .env -f compose.yml -f compose.prod.yml up -d --build
#
# Caddy routes /api/* to the backend and everything else to the web app, so the browser only ever talks to
# one origin (first-party cookies, live updates). Postgres, Redis and WAHA are never reachable from outside.
x-limits: &limits
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

x-prod-env: &prod-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  WAHA_URL: http://waha:3000
  ENVIRONMENT: production
  LOG_JSON: "true"

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      # A domain (mail.example.com) gets a free Let's Encrypt certificate; ":80" serves plain HTTP on any address.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (your domain, or :80)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    <<: *limits

  web:
    image: mailsentinel-web:${TAG:-local}
    build:
      context: ../frontend
      args:
        # Rewrites are baked in at build time; the web container reaches the API over the internal network.
        API_ORIGIN: http://api:8000
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    environment:
      API_ORIGIN: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 512m}
    <<: *limits

  api:
    environment: *prod-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2",
              "--proxy-headers", "--forwarded-allow-ips", "*"]
    deploy:
      resources:
        limits: {memory: 768m}
    <<: *limits

  migrate:
    environment: *prod-env

  worker:
    environment: *prod-env
    deploy:
      resources:
        limits: {memory: 768m}
    <<: *limits

  scheduler:
    environment: *prod-env
    deploy:
      resources:
        limits: {memory: 256m}
    <<: *limits

  dispatcher:
    environment: *prod-env
    deploy:
      resources:
        limits: {memory: 256m}
    <<: *limits

  gmail-listener:
    environment:
      <<: *prod-env
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-pubsub.json
    <<: *limits

  postgres:
    <<: *limits

  redis:
    <<: *limits

  waha:
    deploy:
      resources:
        limits: {memory: 1g}
    <<: *limits

  # Nightly database dumps in ./backups (7 daily, 4 weekly, 3 monthly kept).
  backup:
    image: prodrigestivill/postgres-backup-local:17
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
    volumes: [./backups:/backups]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    <<: *limits

volumes:
  caddy-data:
  caddy-config:

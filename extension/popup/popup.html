<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmailFilter Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      width: 420px;
      min-height: 500px;
      max-height: 600px;
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .email-card {
      transition: all 0.3s ease;
    }
    
    .email-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }
    
    .fade-in {
      animation: fadeIn 0.3s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }
    
    .scroll-container {
      max-height: 400px;
      overflow-y: auto;
    }
    
    .scroll-container::-webkit-scrollbar {
      width: 6px;
    }
    
    .scroll-container::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    
    .scroll-container::-webkit-scrollbar-thumb {
      background: #667eea;
      border-radius: 10px;
    }
    
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body class="bg-gray-50">
  
  <!-- Login Screen -->
  <div id="loginScreen" class="hidden">
    <div class="gradient-bg text-white p-6 text-center">
      <i class="fas fa-envelope-open-text text-5xl mb-3"></i>
      <h1 class="text-2xl font-bold mb-2">EmailFilter Pro</h1>
      <p class="text-sm opacity-90">Manage your Gmail like a pro</p>
    </div>
    
    <div class="p-6">
      <!-- Email Login Tab -->
      <div id="emailLoginTab">
        <h2 class="text-lg font-semibold mb-4 text-gray-800">Sign in with Email</h2>
        
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input 
              type="email" 
              id="emailInput" 
              placeholder="your@email.com"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
            >
          </div>
          
          <button 
            id="sendOtpBtn" 
            class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 transition"
          >
            <i class="fas fa-paper-plane mr-2"></i>Send OTP
          </button>
        </div>
        
        <!-- OTP Verification -->
        <div id="otpSection" class="hidden mt-4 fade-in">
          <div class="bg-green-50 border border-green-200 rounded-lg p-3 mb-4">
            <p class="text-sm text-green-800">
              <i class="fas fa-check-circle mr-2"></i>OTP sent! Check your email
            </p>
          </div>
          
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Enter 6-digit OTP</label>
            <input 
              type="text" 
              id="otpInput" 
              placeholder="000000"
              maxlength="6"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent text-center text-2xl tracking-widest"
            >
          </div>
          
          <button 
            id="verifyOtpBtn" 
            class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 transition mt-4"
          >
            <i class="fas fa-check mr-2"></i>Verify & Login
          </button>
        </div>
      </div>
      
      <!-- Phone Login Tab -->
      <div class="mt-4 pt-4 border-t">
        <button 
          id="switchToPhoneBtn"
          class="w-full text-purple-600 py-2 rounded-lg font-medium hover:bg-purple-50 transition"
        >
          <i class="fas fa-mobile-alt mr-2"></i>Sign in with Phone Instead
        </button>
      </div>
    </div>
    
    <div id="loadingIndicator" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
      <div class="bg-white rounded-lg p-6 text-center">
        <div class="spinner mx-auto mb-3"></div>
        <p class="text-gray-700">Processing...</p>
      </div>
    </div>
  </div>
  
  <!-- Dashboard Screen -->
  <div id="dashboardScreen" class="hidden">
    <!-- Header -->
    <div class="gradient-bg text-white p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="flex items-center space-x-3">
          <i class="fas fa-envelope-open-text text-2xl"></i>
          <div>
            <h1 class="text-lg font-bold">EmailFilter Pro</h1>
            <p class="text-xs opacity-90" id="userEmail">user@example.com</p>
          </div>
        </div>
        <button id="logoutBtn" class="hover:bg-white hover:bg-opacity-20 p-2 rounded-lg transition">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
      
      <!-- Stats -->
      <div class="grid grid-cols-3 gap-2">
        <div class="bg-white bg-opacity-20 rounded-lg p-2 text-center">
          <div class="text-xl font-bold" id="inboxCount">0</div>
          <div class="text-xs opacity-90">Inboxes</div>
        </div>
        <div class="bg-white bg-opacity-20 rounded-lg p-2 text-center">
          <div class="text-xl font-bold" id="emailCount">0</div>
          <div class="text-xs opacity-90">Emails</div>
        </div>
        <div class="bg-white bg-opacity-20 rounded-lg p-2 text-center">
          <div class="text-xl font-bold" id="filterCount">0</div>
          <div class="text-xs opacity-90">Filters</div>
        </div>
      </div>
    </div>
    
    <!-- Navigation Tabs -->
    <div class="bg-white border-b flex">
      <button class="flex-1 py-3 text-center font-medium transition tab-btn active" data-tab="emails">
        <i class="fas fa-inbox mr-2"></i>Emails
      </button>
      <button class="flex-1 py-3 text-center font-medium transition tab-btn" data-tab="filters">
        <i class="fas fa-filter mr-2"></i>Filters
      </button>
      <button class="flex-1 py-3 text-center font-medium transition tab-btn" data-tab="settings">
        <i class="fas fa-cog mr-2"></i>Settings
      </button>
    </div>
    
    <!-- Emails Tab -->
    <div id="emailsTab" class="p-4 tab-content">
      <!-- Inbox Selector -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Select Inbox</label>
        <select 
          id="inboxSelector" 
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
        >
          <option value="">All Inboxes</option>
        </select>
      </div>
      
      <!-- Search -->
      <div class="mb-4">
        <div class="relative">
          <input 
            type="text" 
            id="emailSearch" 
            placeholder="Search emails..."
            class="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500"
          >
          <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
        </div>
      </div>
      
      <!-- Email List -->
      <div id="emailList" class="scroll-container space-y-2">
        <!-- Emails will be inserted here -->
      </div>
      
      <!-- Load More -->
      <button id="loadMoreBtn" class="hidden w-full mt-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
        Load More
      </button>
    </div>
    
    <!-- Filters Tab -->
    <div id="filtersTab" class="p-4 tab-content hidden">
      <button id="createFilterBtn" class="w-full gradient-bg text-white py-3 rounded-lg font-semibold hover:opacity-90 transition mb-4">
        <i class="fas fa-plus mr-2"></i>Create New Filter
      </button>
      
      <div id="filterList" class="scroll-container space-y-2">
        <!-- Filters will be inserted here -->
      </div>
    </div>
    
    <!-- Settings Tab -->
    <div id="settingsTab" class="p-4 tab-content hidden">
      <div class="space-y-4">
        <!-- Connected Accounts -->
        <div>
          <h3 class="font-semibold text-gray-800 mb-2">
            <i class="fas fa-envelope mr-2 text-purple-600"></i>Connected Accounts
          </h3>
          <div id="connectedAccounts" class="space-y-2">
            <!-- Accounts will be listed here -->
          </div>
          <button id="connectGmailBtn" class="w-full mt-2 py-2 border-2 border-purple-600 text-purple-600 rounded-lg font-medium hover:bg-purple-50 transition">
            <i class="fab fa-google mr-2"></i>Connect Gmail Account
          </button>
        </div>
        
        <!-- Sync Settings -->
        <div class="pt-4 border-t">
          <h3 class="font-semibold text-gray-800 mb-2">
            <i class="fas fa-sync mr-2 text-purple-600"></i>Sync Settings
          </h3>
          <label class="flex items-center justify-between cursor-pointer">
            <span class="text-sm text-gray-700">Auto-sync emails</span>
            <input type="checkbox" id="autoSyncToggle" class="toggle" checked>
          </label>
        </div>
        
        <!-- Account Info -->
        <div class="pt-4 border-t">
          <h3 class="font-semibold text-gray-800 mb-2">
            <i class="fas fa-user mr-2 text-purple-600"></i>Account Info
          </h3>
          <div class="text-sm text-gray-600 space-y-1">
            <p><strong>Plan:</strong> <span id="userPlan">Free</span></p>
            <p><strong>Member since:</strong> <span id="memberSince">-</span></p>
          </div>
        </div>
        
        <!-- Danger Zone -->
        <div class="pt-4 border-t">
          <button id="logoutBtnSettings" class="w-full py-2 bg-red-50 text-red-600 rounded-lg font-medium hover:bg-red-100 transition">
            <i class="fas fa-sign-out-alt mr-2"></i>Sign Out
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Email Detail Modal -->
  <div id="emailDetailModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg w-full max-w-md max-h-96 overflow-hidden">
      <div class="gradient-bg text-white p-4 flex items-center justify-between">
        <h2 class="font-bold">Email Details</h2>
        <button id="closeEmailDetail" class="hover:bg-white hover:bg-opacity-20 p-2 rounded">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="emailDetailContent" class="p-4 overflow-y-auto" style="max-height: 300px;">
        <!-- Email content will be inserted here -->
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
